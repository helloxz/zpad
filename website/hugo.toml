baseURL = "https://zpad.xphub.dev/"
title = "ZPad"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

# The site is the app's shop window: three screenshots, a download page and the
# latest release notes. No blog, no docs tree.
[params]
  github = "https://github.com/helloxz/zpad"
  issues = "https://github.com/helloxz/zpad/issues/new"
  mygo = "https://mygo.run/"
  # Site visit analytics: the script tag is rendered verbatim at the end of
  # <head>, and nothing is rendered while this is empty. Keep it to one line.
  analyticsScript = '<script defer src="https://tj.rss.ink/custom.js" data-website-id="d83d5bfe-5dbb-41a0-be92-6f14f13c65cf"></script>'

[languages]
  [languages.zh]
    label = "中文"
    locale = "zh-Hans"
    weight = 1
    title = "ZPad · 轻量级原生文本编辑器"
    [languages.zh.params]
      description = "ZPad 是一个基于 MyGo 原生 UI 的轻量级文本 / 代码编辑器：左右分屏、多标签、Markdown 即时预览，界面由 Go 直接绘制，不启动 WebView。"
  [languages.en]
    label = "English"
    locale = "en"
    weight = 2
    title = "ZPad · a lightweight native text editor"
    [languages.en.params]
      description = "ZPad is a lightweight text and code editor built on MyGo's native UI: split panes, multiple tabs and live Markdown preview, drawn in Go with no WebView."

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[minify]
  minifyOutput = true

# The release partial reads this only if a read-only token is set, to stay
# clear of the unauthenticated 60-requests-per-hour limit on GitHub's API.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^GITHUB_TOKEN$']

# The short download links are generated from the release data at build time.
# A media type with no suffix lets the file land at the site root as _redirects.
[mediaTypes."text/redirects"]
  suffixes = [""]
  delimiter = ""

[outputFormats.REDIRECTS]
  mediaType = "text/redirects"
  baseName = "_redirects"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "REDIRECTS"]

# English does not need a second copy of the root redirects file.
[languages.en.outputs]
  home = ["HTML"]
