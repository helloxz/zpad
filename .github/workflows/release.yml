name: Release

# A tag you push builds the apps and puts them in a draft release, which you
# review and publish. macOS apps are signed ad hoc, which Gatekeeper blocks on
# other Macs, and the Windows apps have no signature, which SmartScreen warns
# about; the Linux apps ship as a .deb, a .rpm and a tarball with install.sh,
# and only the tarball's install can update itself. Installed apps update
# themselves from the release's signed update files, so publish it as the
# latest release, not a pre-release: the manifests are fetched from
# releases/latest/download/. `mygo build -upload` uploads the archives and
# deltas first and the manifests last. Artifacts keep the names `mygo build`
# gives them; the portable Windows copy is the one addition.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  draft:
    name: Draft release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag names the configured version
        run: |
          want="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match $want in mygo.json"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun of the tag keeps the draft, and its files are replaced.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes

  macos:
    name: macOS
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test on the platform the app ships
        run: go test ./...
      - name: Build and upload the app and its update
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64 -upload

  windows:
    name: Windows
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload the app, the installer and the update
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64 -upload
      - name: Make the portable copy
        run: |
          v=$(jq -r .version mygo.json)
          cd build
          # A portable copy runs from any writable folder, without the
          # installer and without the updater's file list, which only an
          # installed app has. Its files go at the zip's root, so extracting
          # leaves ZPad.exe ready to run: no folder to move it out of.
          rm -rf ZPad-portable
          mkdir ZPad-portable
          cp -a windows-amd64/. ZPad-portable/
          rm -f ZPad-portable/.mygo-files ZPad-portable/install.ps1 ZPad-portable/zpad-setup-*.exe
          rm -f ZPad-portable/zpad-*.tar.gz ZPad-portable/*.delta ZPad-portable/update-*.json
          (cd ZPad-portable && zip -qr "../zpad-$v-windows-amd64-portable.zip" .)
          # A wrapper folder would put the exe one level down; keep it at the
          # root so "extract here" leaves the app ready to run.
          listing=$(unzip -Z1 "zpad-$v-windows-amd64-portable.zip")
          if ! grep -qx 'ZPad.exe' <<<"$listing"; then
            echo "::error::ZPad.exe is not at the portable zip's root; extracting must not need a folder step"
            exit 1
          fi
      - name: Upload the portable copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version mygo.json)
          gh release upload "$GITHUB_REF_NAME" \
            "build/zpad-$v-windows-amd64-portable.zip" --clobber

  linux:
    name: Linux
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # MyGo draws the window itself and opens GTK through purego, so no GTK
      # development packages are needed to build; the .deb and .rpm depend on
      # the runtime libraries the package metadata names.
      - name: Build and upload the app, its packages and update
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform linux/amd64 -upload
